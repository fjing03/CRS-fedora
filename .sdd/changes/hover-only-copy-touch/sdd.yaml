# What the measurement established (touch emulation, tap probes)
findings:
  - "the shared data-tip engine listens only to mouseenter / mouseleave / mouseout / focusin / focusout — no touch path"
  - "focus parity therefore covers every FOCUSABLE carrier on touch: tapping focuses, focusin shows the tip"
  - "verified on a real blocked slot: 91 reason tips in the grid, all on .cell-content[tabindex=0], all tap-reachable"
  - "unreachable carriers at >=1024: 8 My Replacements <th> tips, .result-count, badge-holiday, status-rejected, badge-outline, .btn-tip x2, .legend-item x4"
  - "the legend names a gesture: 'HOVER the slot' is correct on pointer only — wrong on touch (tap) and keyboard (focus)"

