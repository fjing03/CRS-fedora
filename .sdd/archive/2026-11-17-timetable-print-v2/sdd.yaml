archive_note: >-
  Closed after a follow-up question about non-normal classes on paper. The answer was that
  the paper already does exactly what the user then stated as the rule: Show normal class
  off prints everything except cancelled and pending; on prints normal classes only. Proven
  across 14 weeks on five pages (two lecturers, two rooms, one cohort), with the one
  cancelled class in the demo data as the only class ever dropped. No code changed as a
  result of that investigation.
