<!doctype html>
<html lang="en" class="light">
<!--
  STUDENT MY TIMETABLE — RESPONSIVE, THROWAWAY PROTOTYPE · 15 Nov 2026
  Question: can the student timetable — the same page as My Timetable with a
  student's data — take the approved responsive shape?
  Same four breakpoints as the staff preview: 320–767 one-day agenda;
  768–1023 two-day grid; 1024–1279 three-day grid; 1280+ the ORIGINAL
  horizontal-time weekly grid.
  This file is the staff preview (my-timetable-mobile-preview.html) with the
  student page's differences applied, so the two cannot drift:
    · read-only — no Cancel this Class?, no Arrange Replacement, no cancel
      wiring; the details pop-up ends at Close and the request facts
      (Requested At / Requested By) stay the lecturer's business, not the
      student's;
    · the student's own identity — cohort chip beside the title, nav is
      `My Timetable` + `Class Replacements`, role `Student`;
    · block tips name the lecturer (a student needs to know who teaches);
    · the summary card reads `Class Hours`, as the live student blade does.
  Below 1280px a card prints the subject code and type only — the name lives in
  the hover tip and the details pop-up (user, 2026-11-15).
  Unchanged on purpose: block colours, the one-label rule (only Cancelled and
  Conflict carry a word inside a block), the phone agenda, the day strip, the
  Week summary sheet, the guide dialog, the tips engine and the print handoff.
  ONLY THIS FILE is new. Shared assets are read-only, linked from the sibling
  repo. Fixtures live in this HTML; nothing reads or writes the system.
  Open this file directly, or from the parent directory run:
    python3 -m http.server 8090
  then visit http://127.0.0.1:8090/ui-prototype/student-my-timetable-mobile-preview.html
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student My Timetable — responsive prototype</title>
  <link rel="stylesheet" href="../public/css/theme.css">
  <style>
    [hidden] { display: none !important; }
    html { color-scheme: light; }
    html.dark { color-scheme: dark; }
    body { min-width: 320px; }
    button, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--color-primary); outline-offset: 3px;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .preview-icon { width: 16px; height: 16px; flex: none; vertical-align: middle; }
    .preview-button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 12px; border: 1px solid var(--color-outline); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-on-surface); }
    .preview-button:hover { background: var(--color-surface-variant); }
    .preview-icon-button { padding: 8px; }
    /* The live header is `position: fixed`; the preview used to override it to
       `relative`, so the whole bar — hamburger included — scrolled away. Keep it
       pinned, and reserve its height below so nothing hides underneath. */
    .preview-nav { position: fixed; top: 0; left: 0; right: 0; }
    /* Below 1280px the inline nav is hidden, so nothing pushes the action group
       across and the hamburger drifted into the middle of the bar. Pin the group
       to the right edge so the menu button stays at the top-right corner. */
    .preview-nav .top-right { margin-left: auto; }
    .preview-nav .top-logo img { max-width: 150px; }
    .preview-nav .preview-menu { display: none; }
    .preview-main { padding-top: calc(var(--top-bar-height) + 24px); }
    .preview-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .preview-heading .page-title { font-size: clamp(20px, 3vw, 22px); }
    .preview-controls { margin-bottom: 12px; }
    .preview-controls .semester-bar { flex-direction: row; flex-wrap: nowrap; }
    .preview-controls .week-nav { min-width: 0; }
    .preview-controls .week-select { max-width: 100%; background-color: var(--color-surface-variant); }
    .preview-controls .week-select:hover { background-color: var(--color-surface); }
    .preview-days { display: none; }
    .preview-day { min-width: 44px; min-height: 52px; flex: 1 0 44px; border: 1px solid var(--color-outline); border-radius: var(--radius-md); padding: 4px; background: var(--color-surface); color: var(--color-on-surface-variant); font-size: 11px; }
    .preview-day strong { display: block; font-size: 14px; color: var(--color-on-surface); }
    .preview-day[aria-pressed="true"] { border: 2px solid var(--color-primary); background: var(--color-primary-container); color: var(--color-on-primary-container); }
    .preview-day::after { content: ''; display: block; width: 4px; height: 4px; margin: 3px auto 0; border-radius: 50%; }
    .preview-day.is-today::after { background: var(--color-primary); }
    .preview-day.is-holiday { color: var(--color-error); }
    .preview-tools { display: none; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 14px; }
    #previewDayCount { display: block; margin-top: 4px; font-size: 12px; color: var(--color-on-surface-variant); }
    .preview-day-heading { margin: 0; font-size: 15px; font-weight: 600; }
    .preview-agenda { display: grid; gap: 12px; }
    .preview-class.event-block { position: relative; inset: auto; display: flex; flex-direction: column; width: 100%; height: auto; min-height: 0; align-items: stretch; justify-content: flex-start; gap: 8px; padding: 12px 14px; text-align: left; white-space: normal; border-radius: var(--radius-sm); font-family: inherit; }
    .preview-class-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .preview-class-top .preview-time { min-width: 0; }
    .preview-class-top .preview-venue { flex: none; }
    /* 2026-11-15 (user): below 1280px a card prints the CODE and type only.
       The subject name lives in the hover tip and the details pop-up, so a
       phone card stops spending two lines on words it cannot show at once. */
    .preview-course-code { display: block; }
    .preview-class .preview-note { font-size: 12px; }
    /* theme hides .ev-note inside a narrow .event-block; the phone card keeps it */
    /* Two classes sharing time look like two unrelated cards in the phone list,
       so the pair is marked: a thin strip down the left edge of BOTH cards, plus
       one plain-English line naming the class it overlaps. */
    .preview-class.is-overlap::before {
      content: ''; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 5px;
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      background: var(--color-on-surface-variant); opacity: .5;
    }
    .preview-class .ev-overlap {
      display: block; margin-top: 7px; padding-top: 6px;
      border-top: 1px dashed var(--color-outline);
      font-size: 11.5px; font-weight: 600; color: var(--color-on-surface-variant);
    }
    .preview-class.event-block::after { display: none; }
    /* Three tiers, by size and one grey — never a second colour language
       (user, 2026-11-15). PRIMARY: the time range and the venue code, the two
       things a student reads to know where to be and when. SECONDARY: the
       subject code + type, smaller and grey. TERTIARY: the note line, small
       and grey, right-aligned — the Cancelled / Conflict word now sits there
       with the "(Pending since …)" / "(Replaced for …)" note instead of
       hanging under the time. */
    .preview-class .preview-time { font-size: 14px; font-weight: 700; }
    .preview-class .preview-venue { font-size: 14px; font-weight: 700; }
    .preview-class .preview-course { font-size: 12px; font-weight: 500; color: var(--color-on-surface-variant); overflow-wrap: anywhere; }
    .preview-class .preview-class-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 3px 8px; margin-top: 3px; font-size: 11px; font-weight: 500; line-height: 1.35; color: var(--color-on-surface-variant); }
    .preview-class .preview-class-note .ev-note { display: inline; margin: 0; font-size: 11px; font-weight: 500; text-align: right; color: inherit; }
    .preview-status { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; line-height: 1.4; }
    .preview-status .preview-icon { width: 13px; height: 13px; }
    /* the word keeps the block's own colour — it is the alarm, only its size
       drops to the note tier */
    .preview-class .preview-class-note .preview-status { font-size: 11px; font-weight: 500; color: var(--color-on-error-container); }
    .preview-class .preview-class-note .preview-status .preview-icon { width: 12px; height: 12px; }
    .preview-class.event-pending { border-style: dashed; }
    .preview-class.event-replacement { border-left-width: 6px; }
    /* the cancelled card's code is already the grey secondary tier — no second fade */
    .preview-note { font-size: 11px; }
    /* Empty states use the shipped ui-empty-state markup; the next-class hint is
       the approved phone addition that rides inside it. */
    .preview-next-hint { display: grid; gap: 7px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--color-outline); text-align: left; }
    button.preview-next-hint { width: 100%; min-height: 44px; padding: 14px 0 0; border-right: 0; border-bottom: 0; border-left: 0; border-radius: 0; background: transparent; color: inherit; font: inherit; }
    button.preview-next-hint:hover .preview-next-details { color: var(--color-primary); }
    .preview-next-caption { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-on-surface-variant); }
    .preview-next-details { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .preview-next-details strong { font-weight: 600; }
    .preview-next-venue { padding: 3px 7px; border-radius: var(--radius-sm); background: var(--color-surface-variant); color: var(--color-on-surface); font-size: 11px; font-weight: 600; }
    .preview-holiday { margin-bottom: 12px; padding: 24px 20px; border-radius: var(--radius-md); background: var(--color-error-container); color: var(--color-on-error-container); }
    .preview-holiday .empty-title, .preview-holiday .empty-text, .preview-holiday .empty-icon { color: inherit; }
    .preview-holiday .preview-next-hint { border-top-color: var(--color-on-error-container); }
    .preview-tablet-grid { display: grid; grid-template-columns: 50px repeat(var(--day-count), minmax(0, 1fr)); grid-template-rows: 62px repeat(22, 44px); border: 1px solid var(--color-outline); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
    .preview-tablet-head { padding: 10px 6px; text-align: center; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--color-outline); background: var(--color-surface-variant); }
    .preview-tablet-head small { display: block; font-size: 11px; font-weight: 400; }
    .preview-axis { padding: 5px 4px; font-size: 10px; color: var(--color-on-surface-variant); border-bottom: 1px solid var(--color-outline); }
    .preview-grid-cell { border-left: 1px solid var(--color-outline); border-bottom: 1px solid var(--color-outline); }
    .preview-tablet-grid .preview-class { z-index: 1; min-height: 0; margin: 2px; width: auto; padding: 6px; gap: 2px; border-radius: 0; }
    .preview-tablet-grid .preview-time { font-size: 11px; }
    .preview-tablet-grid .preview-venue { font-size: 11px; }
    .preview-tablet-grid .preview-course { font-size: 10px; }
    .preview-tablet-grid .preview-class-note { font-size: 9.5px; }
    .preview-tablet-grid .preview-class-note .preview-status { font-size: 9.5px; }
    /* a 1-column tablet block is ~150px: the tablet rule below lets the venue
       fall to a second line rather than shrink the time range. */
    .preview-tablet-grid .preview-note { font-size: 10px; }
    .preview-tablet-grid .preview-class { overflow-y: auto; }
    .preview-tablet-grid .preview-class-top { flex-wrap: wrap; gap: 2px 8px; }
    /* when the venue cannot share the line, it keeps the right rail */
    .preview-tablet-grid .preview-venue { margin-left: auto; }
    .preview-desktop-grid .event-block { border-radius: 0; }
    .preview-desktop-grid td.hour-cell.offday-slot { background: transparent; }
    .preview-desktop-grid .event-block:focus-visible { z-index: 51; outline-offset: -3px; }
    .preview-desktop-grid .event-block .preview-status { font-size: 9px; }
    .preview-desktop-extras { margin-top: 18px; }
    /* Restore the shipped flip, but keep the approved 96px height and column widths.
       Three short bullets fit on the back; both faces stay absolutely positioned. */
    .summary-card { min-height: 96px; cursor: pointer; }
    .summary-card .summary-card-inner { min-height: 96px; height: 96px; }
    .summary-card:hover .summary-card-inner { transform: none; }
    .summary-card.preview-flipped .summary-card-inner { transform: rotateY(180deg); }
    @media (hover: hover) and (pointer: fine) {
      .summary-card:not(.preview-unflipped):hover .summary-card-inner { transform: rotateY(180deg); }
    }
    /* `+N` is the pending tail, not a second headline: keep the shared tertiary
       colour but set it clearly smaller than the main number (user, round 1). */
    .summary-card .summary-value .sum-pending { font-size: 0.62em; font-weight: 600; margin-left: 1px; }
    /* ── Enhanced summary cards ──────────────────────────────────────────────
       Adopted from ui-prototype/summary-card-back-preview.html ("Proposed"):
       leading 1.45, 4px between bullets, the block vertically centred, and the
       info button moved to the top-right so it stops eating the bottom of the
       text. The 38px right reserve is uniform, so it clears the 44px button on
       every line (back padding 8px + 38 = 46px). 39px is the last reserve that
       does not re-wrap a bullet; 40px re-wraps "Includes completed". */
    .summary-card-back { padding: 6px 8px; text-align: left; justify-content: center; }
    .summary-card-back .summary-description { width: 100%; font-size: 12px; line-height: 1.45; padding-right: 38px; }
    .preview-summary-points { margin: 0; padding-left: 12px; display: grid; gap: 4px; }
    .summary-card-back .preview-summary-info { position: absolute; top: 0; bottom: auto; right: 0; width: 44px; height: 44px; min-width: 44px; min-height: 44px; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-on-surface-variant); cursor: pointer; }
    .preview-summary-info:hover, .preview-summary-info:focus-visible { color: var(--color-primary); background: var(--color-primary-container); }
    .preview-modal.modal--summary { max-width: 420px; }
    .preview-summary-full { font-size: 13px; line-height: 1.5; }
    .preview-summary-full .preview-summary-points { gap: 8px; padding-left: 18px; }
    .summary-card:not(.preview-flipped):not(:hover) .preview-summary-info { visibility: hidden; }
    .preview-summary-points li::marker { color: var(--color-on-surface-variant); }
    .preview-summary-points .summary-normal { color: var(--color-on-secondary-container); }
    .preview-summary-points .summary-replacement { color: var(--color-on-primary-container); }
    .preview-summary-points .summary-pending { color: var(--color-on-tertiary-container); }
    .preview-summary-points .summary-excluded { color: var(--color-on-error-container); }

    /* ── Structured explanation (enhanced design) ────────────────────────────
       A short formula strip first, then two-line bullets: the bold term on
       line 1, the meaning under it via <br>. Nothing is one dense paragraph.
       Chips carry a TERM, never a live number: every front value is written at
       runtime, so a printed number would be wrong on any other week. */
    .explain-formula { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin: 0 0 16px; }
    .explain-chip {
      display: flex; flex-direction: column; gap: 1px; justify-content: center;
      text-align: center; padding: 9px 13px; min-width: 0;
      border-radius: var(--radius-md); background: var(--color-surface-variant);
      border: 0.5px solid var(--color-outline);
    }
    .explain-chip b { font-size: 12.5px; font-weight: 700; line-height: 1.25; letter-spacing: -.1px; }
    .explain-chip.is-pending b { color: var(--color-on-tertiary-container); }
    .explain-chip.is-blue b { color: var(--color-on-primary-container); }
    .explain-plus { align-self: center; font-weight: 600; font-size: 14px; color: var(--color-on-surface-variant); }
    .explain-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 11px; }
    .explain-list li { font-size: 13px; line-height: 1.4; color: var(--color-on-surface); }
    .explain-list li strong { font-weight: 700; }
    .explain-list li span { color: var(--color-on-surface-variant); }
    .explain-foot {
      margin: 15px 0 0; padding-top: 11px;
      border-top: 0.5px solid var(--color-outline);
      font-size: 11.5px; line-height: 1.45; color: var(--color-on-surface-variant);
    }
    .preview-modal .summary-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .preview-modal .summary-hint { display: flex; }
    /* Two columns cannot hold three bullets below 390px (measured on the live
       page: 320px spills +14px, 360 and 375px spill +5px). One column fixes it.
       PLACEMENT MATTERS: this must stay AFTER the 2-column rule above — both are
       `.preview-modal .summary-bar` (specificity 0,2,0), so source order decides.
       Placed earlier, the 2-column rule wins and 320px still spills. */
    @media (max-width: 389px) {
      .preview-modal .summary-bar { grid-template-columns: 1fr; }
    }
    .preview-footer { padding: 28px 0 20px; text-align: center; font-size: 11px; color: var(--color-on-surface-variant); }
    /* Shipped detail/cancel skins only. theme.css owns the type scale, the modal
       width, the phone dock and the stacked phone footer; the page's own footer
       rules (.modal-footer padding / left / right) are mirrored from my-timetable. */
    .preview-overlay { z-index: 200; }
    /* ══ 2026-11-13 (user): responsive modal — PROTOTYPE TRIAL, NOT LIVE ══
       Seven agreed decisions, applied here only so they can be looked at
       before anything shared is touched.

       1. Sheet cut-off moves 768 -> 600. Above 600 the pop-up is a centred,
          content-sized dialog; at <=600 it is a flush bottom sheet.
       2. The 601-768 mismatch (phone-ish page, desktop-ish dialog) is accepted
          and pinned by a test rather than assumed safe.
       3. Footer bug fixed: the two wrappers stretch and `.btn-danger` joins the
          full-width list, so the stacked buttons actually fill the sheet.
       4. Overlay padding is dropped <=600 so the sheet docks flush.
       5. The x becomes a 48px target <=600 instead of the 40px it measured.
       6. Header and footer are pinned; only the body scrolls.
       7. Prototype first, then live with the full test pass.

       Why the width law changed at all: `fit-content` measures the widest
       intrinsic row (subtitle, tab rail, label/value) and clamps it between a
       420px floor and each variant's existing ceiling. A paragraph-only body
       still reaches its ceiling - correct, and unavoidable. */

    /* -- The dialog: every size above the sheet cut-off --
       NOTE: theme.css still ships its sheet rules at `max-width: 768px`, so
       between 601 and 768 the shipped stylesheet parks the pop-up on the
       bottom edge with a square bottom, a stacked footer and 16px body
       padding. These declarations put the DIALOG back in that band; without
       them 601-768 stays a half-sheet, which is the mismatch decision 2 was
       meant to constrain rather than create. */
    @media (min-width: 601px) {
      .preview-modal {
        width: fit-content;
        min-width: 420px;
        margin: auto;
        border-radius: var(--radius-2xl);
        border-bottom: 1px solid var(--color-outline);
        max-height: 85dvh;
        padding-bottom: 0;
      }
      .preview-overlay { align-items: center; }
      .preview-modal .modal-header { padding: 18px 22px 0; }
      .preview-modal .modal-body { padding: 16px 22px; }
      /* the shipped sheet stacks the footer; the dialog puts it back on one
         row, Close left / actions right */
      .preview-modal .modal-footer {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 14px 24px 18px;
      }
      .preview-modal .modal-footer-left,
      .preview-modal .modal-footer-right {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        width: auto;
      }
      /* ceilings: unchanged, each was chosen for a reason */
      .preview-modal.modal--detail { max-width: 680px; }
      .preview-modal.modal--cancel { max-width: 588px; }
      .preview-modal.modal--guide { max-width: 520px; }
      .preview-modal.modal--summary { max-width: 420px; }
    }

    /* -- Pinned header + footer, scrollable body (all sizes) --
       The whole `.modal` used to be the scroller, so a long tab scrolled the
       title, the x and the Close/Cancel actions off-screen. Now the modal is a
       fixed three-row column: header / body (flex:1, scrolls) / footer.
       `min-height: 0` is what lets the middle actually shrink. */
    .preview-modal {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-modal .modal-header,
    .preview-modal .modal-footer {
      flex: 0 0 auto;
    }
    .preview-modal .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }
    .preview-modal .modal-body .page-desc { margin-bottom: 14px; }
    .preview-modal .modal-footer {
      padding: 14px 24px 18px;
      border-top: 1px solid var(--color-outline-variant);
    }
    .preview-modal .modal-footer-left { display: flex; align-items: center; }
    .preview-modal .modal-footer-right { display: flex; align-items: center; gap: 10px; }

    /* -- The sheet: phones only, <=600px -- */
    @media (max-width: 600px) {
      /* 4. drop the overlay's 20px so the sheet truly docks flush.
         The safe-area inset is applied on the modal below. */
      .preview-overlay {
        padding: 0;
        align-items: flex-end;
      }
      .preview-modal {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        max-height: 85dvh;
        margin: 0;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        border-bottom: 0;
        padding-bottom: env(safe-area-inset-bottom);
      }
      /* 5. the x was 40px - one tap target below the floor the stylesheet
         declares for phones. 48 is the honest size for the control people
         reach for most. */
      .preview-modal .modal-close {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
      .preview-modal .modal-header { padding: 14px 16px 0; }
      .preview-modal .modal-body { padding: 16px; }
      /* 3. stack the footer and make BOTH groups stretch. Without
         `align-items: stretch` the wrappers stay shrink-to-fit and a
         `width:100%` child can only fill its own tiny wrapper - which is
         exactly the 75px/126px buttons the screenshots showed. */
      .preview-modal .modal-footer {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }
      .preview-modal .modal-footer-left,
      .preview-modal .modal-footer-right {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        width: 100%;
      }
      /* `.btn-danger` was missing from theme.css's full-width list, so
         "Cancel Class?" stayed 126px wide while everything around it was
         meant to fill the sheet. */
      .preview-modal .modal-footer .btn-close-modal,
      .preview-modal .modal-footer .btn-outline,
      .preview-modal .modal-footer .btn-danger,
      .preview-modal .modal-footer .btn-action,
      .preview-modal .modal-footer .btn-replace-now {
        width: 100%;
        min-height: 48px;
        height: auto;
      }
    }

    /* 2. the band between the page's mobile layout (768) and the sheet
       cut-off (600): the page looks phone-ish while the dialog looks
       desktop-ish. Accepted deliberately; the spec pins 601 / 700 / 768 so a
       future change cannot make this band silently broken. */
    body.preview-locked { overflow: hidden; }
    /* Badge system (badge-spec): ONE pill geometry, colours untouched.
       The 40px touch-target rule in theme.css exists for tappable chips, so it is
       cancelled here — a status badge inside a detail row is not a control. */
    .preview-modal .badge,
    .preview-modal .badge-holiday,
    .preview-modal .badge-reason,
    .preview-modal .badge-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      height: 24px;

        {id:'205',di:2,start:2,end:5,code:'BMCS3404',name:'Project I',type:'T',venue:'B100',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'normal',lecturer:'Dr. Raj Kumar'},
        {id:'206',di:2,start:12,end:15,code:'BMIT3303',name:'Computer Networks',type:'L',venue:'B111',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'replacement',replacedFor:'04-Nov-2026',lecturer:'Ms. Lee Hui Min'},
        {id:'207',di:3,start:2,end:5,code:'AMCS2093',name:'Discrete Mathematics',type:'T',venue:'B106',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'normal',lecturer:'Pn. Surayaini Binti Basri'},
        {id:'208',di:3,start:8,end:11,code:'BMCS2023',name:'Database Systems',type:'P',venue:'B009',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'normal',lecturer:'Dr. Tan Mei Ling'},
        {id:'209',di:3,start:14,end:17,code:'BMIT2201',name:'Software Engineering',type:'L',venue:'B111',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'cancelled',remarks:'Lecturer on annual leave — a make-up will be arranged.',lecturer:'En. Lim Jia Zheng'},
        {id:'210',di:3,start:18,end:19,code:'BMCS3404',name:'Project I',type:'P',venue:'B010',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'conflict',remarks:'Venue unavailable — maintenance work.',lecturer:'Dr. Raj Kumar'},
        {id:'211',di:4,start:4,end:7,code:'BMIT3103',name:'Web Application Development',type:'L',venue:'B110',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'normal',lecturer:'Mr. Wong Kah Seng'},
        {id:'212',di:4,start:6,end:7,code:'BMIT3303',name:'Computer Networks',type:'T',venue:'B106',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'cancelled',remarks:'Cancelled — stacks above the class it overlaps.',lecturer:'Ms. Lee Hui Min'},
        {id:'213',di:5,start:0,end:1,code:'BMIT3303',name:'Computer Networks',type:'T',venue:'B106',cohorts:['DFT2 (S1) G1'],studentCounts:[24],status:'normal',lecturer:'Ms. Lee Hui Min'}
      ]

    // The payload always ships the lecturer: a student's classes have many.
    const $ = id => document.getElementById(id);

    const icon = (name, cls='preview-icon') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const fixtureToday = '2026-11-12';
    const state = { week: 7, day: 3, mode: 'normal' };
    // Only local preview navigation reads these; never boot or call the live system.
    const returnParams=new URLSearchParams(window.location.search);
    for(const [key,max] of [['week',MockData.semester.weeks-1],['day',6]]) {
      const raw=returnParams.get(key), value=Number(raw);
      if(raw!==null && /^\d+$/.test(raw) && Number.isInteger(value) && value>=0 && value<=max) state[key]=value;

    function dateAt(week, day) { const d = new Date(MockData.semester.startDate + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + week * 7 + day); return d; }

    const timeOf = e => `${clock(e.start)} ~ ${clock(e.end + 1)}`;

    function statusOf(e, week = state.week) { return holidayAt(week,e.di) ? 'holiday' : e.status; }
    const statusMeta = {
      normal:['Normal','calendar','event-normal'], pending:['Pending','pending','event-pending'], replacement:['Replacement','swap','event-replacement'],
      cancelled:['Cancelled','close','event-conflict'], conflict:['Conflict','warning','event-conflict'], holiday:['Public Holiday','calendar','event-conflict']

    /* 2026-11-15 (user): the details pop-up names the state in full — "Class
       Cancelled", never a bare "Cancelled", which a reader can take as the
       REQUEST being cancelled rather than the class. A block keeps the short
       word: a one-hour desktop cell is ~60px wide and cannot carry the longer
       one. The spoken label and the hover tip use the full form. */
    const statusFull = { cancelled:'Class Cancelled' };
    const statusLabel = s => statusFull[s] || statusMeta[s][0];
    // Holiday is labelled on the day; only cancellation and conflict need a block label.
    const BADGED = ['cancelled', 'conflict'];
    function badge(e, week = state.week) { const s = statusOf(e,week), meta = statusMeta[s]; return BADGED.includes(s) ? `<span class="preview-status">${icon(meta[1])}${meta[0]}</span>` : ''; }
    // The shipped note vocabulary (buildReplacementNote): parenthesised, system date format.
    function blockNote(e) {
      if(e.status==='replacement' && e.replacedFor) return `(Replaced for ${e.replacedFor})`;
      if(e.status==='pending' && e.requestedAt) return `(Pending since ${e.requestedAt})`;
      return '';
    }
    // Block hover voice — the system's composed shape: subject name · lecturer · STATUS.
    function blockTip(e) { return [e.name, e.lecturer || '—', statusLabel(statusOf(e)).toUpperCase()].filter(Boolean).join(' · '); }
    /* The other class(es) this one shares time with, in plain words. Only the
       phone list uses this — the desktop grid stacks the blocks and the tablet
       shows them side by side, so both already make the overlap obvious. */
    function overlapText(e, list) {
      const others=list.filter(o => o.id!==e.id && o.start<=e.end && e.start<=o.end);
      if(!others.length) return null;
      if(others.length===1) return `Overlaps ${timeOf(others[0])} · ${others[0].code} (${others[0].type})`;
      return `Overlaps ${others.length} other classes`;
    }
    function card(e, overlap) { const s=statusOf(e), note=blockNote(e); return `<button class="event-block preview-class ${statusMeta[s][2]} ${s==='cancelled'?'is-cancelled':''}${overlap?' is-overlap':''}" data-event="${esc(e.id)}" data-tip="${esc(blockTip(e))}" aria-label="${esc(`${timeOf(e)}, ${e.code} ${e.name}, ${e.venue}, ${statusLabel(s)}${overlap?', '+overlap:''}`)}"><span class="preview-class-top"><span class="preview-time">${timeOf(e)}</span><span class="preview-venue">${esc(e.venue)}</span></span><span class="preview-course"><span class="preview-course-code">${esc(e.code)} (${esc(e.type)})</span></span>${(badge(e)||note)?`<span class="preview-class-note">${badge(e)}${note?`<span class="ev-note">${esc(note)}</span>`:''}</span>`:''}${overlap?`<span class="ev-overlap">${esc(overlap)}</span>`:''}</button>`; }
    function nextClass(week, day, after = -1) {
      for (let w=week; w<MockData.semester.weeks; w++) {
        const found=eventsOf(w).find(e => (w>week || e.di>day || (e.di===day && e.end*30+510>after)) && !['cancelled','conflict','holiday','pending'].includes(statusOf(e,w)));
        if(found) return {e:found,w};
      }
      return null;
    }
    function shortTimeOf(e) {
      const start=clock(e.start),end=clock(e.end+1);
      const compact=value=>value.replace(':00','');
      return `${compact(start.slice(-2)===end.slice(-2)?start.slice(0,-3):start)}–${compact(end)}`;
    }
    function nextHint(week,day,after=-1) {

    let weekLabelMode=null;
    function updateWeekLabels() {
      const phone=window.innerWidth<768;
      if(phone===weekLabelMode) return;
      weekLabelMode=phone;
      // Phone: `Week 9 · 16 Nov ~ 22 Nov`. Tablet + desktop: the full dated range.
      $('previewWeek').innerHTML=Array.from({length:MockData.semester.weeks},(_,w)=>{
        const start=fmt(dateAt(w,0),{year:undefined}),end=fmt(dateAt(w,6),{year:undefined});
        const range=phone?`${start} ~ ${end}`:`${fmt(dateAt(w,0))} ~ ${fmt(dateAt(w,6))}`;
        return `<option value="${w}">Week ${w+1} · ${range}</option>`;
      }).join('');
    }
    $('previewWeek').onchange=e=>changeWeek(Number(e.target.value));
    $('previewPrev').onclick=()=>changeWeek(state.week-1); $('previewNext').onclick=()=>changeWeek(state.week+1);
    $('previewToday').onclick=()=>{state.week=7;state.day=3;render();};
    $('previewDays').onclick=e=>{const b=e.target.closest('[data-day]');if(b&&Number(b.dataset.day)!==state.day){state.day=Number(b.dataset.day);render();}};
    [$('previewAgenda'),$('previewTablet'),$('previewDesktop')].forEach(host=>host.addEventListener('click',e=>{const b=e.target.closest('[data-event]');if(b)openClass(eventsOf(state.week).find(item=>item.id===b.dataset.event));}));
    $('previewDesktop').addEventListener('keydown',e=>{const b=e.target.closest('[data-event]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openClass(eventsOf(state.week).find(item=>item.id===b.dataset.event));}});
    $('previewTheme').onclick=()=>{const dark=document.documentElement.classList.toggle('dark');document.documentElement.classList.toggle('light',!dark);};
    $('previewClose').onclick=closeModal;
    $('previewCloseBtn').onclick=closeModal;
    overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
    document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(modalOpen) closeModal(); else closeNavDrawer(); });
    function openWeekSummary() {
      openModal({title:'Week summary',subtitle:`Week ${state.week+1} · ${semesterLabel()} · sample data`,body:summaryHtml(eventsOf(state.week))});
      modal.dataset.view='week-summary';
    }
    function openSummaryExplanation(index) {
      const entry=totals(eventsOf(state.week))[index]; if(!entry) return;
      const fromSummary=modalOpen&&modal.dataset.view==='week-summary';
      openModal({title:entry[0],subtitle:`Week ${state.week+1}`,variant:'summary',
        body:`<div class="preview-summary-full">${fullSummaryDescription(index)}</div>`,
        closeLabel:fromSummary?'Back to summary':'Close'});
      if(fromSummary) $('previewCloseBtn').onclick=()=>{
        openWeekSummary();
        const card=$('modalBody').querySelector(`[data-summary="${index}"]`);
        card?.classList.add('preview-flipped');
        card?.querySelector('.preview-summary-info')?.focus({preventScroll:true});
      };
    }
    $('previewSummary').onclick=openWeekSummary;
    $('previewHelp').onclick=()=>openModal({title:'How to use this page',subtitle:'Student My Timetable',body:`
      <p class="page-desc">Your weekly <span class="info-keyword">class schedule</span> for the whole semester — every session you attend, across all your courses.</p>
      <div class="detail-group"><div class="detail-group-title">Week</div><p>Use the arrows or the week list to move between weeks; <strong>Today</strong> jumps back to the current one.</p></div>
      <div class="detail-group"><div class="detail-group-title">Class details</div><p>Click a class block to see its course, lecturer, venue and request status.</p></div>
      <div class="detail-group"><div class="detail-group-title">Colours</div><p><span class="legend-swatch event-normal"></span> Normal Class &nbsp;·&nbsp; <span class="legend-swatch event-replacement"></span> Replacement &nbsp;·&nbsp; <span class="legend-swatch event-pending"></span> Pending &nbsp;·&nbsp; <span class="legend-swatch event-conflict"></span> Conflict / Public Holiday</p><p>Hover a colour in the legend to see what it means.</p></div>
      <div class="detail-group"><div class="detail-group-title">The five numbers</div><p>They count the week you are looking at, not the whole semester.</p></div>
      <div class="detail-group"><div class="detail-group-title">Read-only</div><p>You cannot request or cancel a class here. Your Programme Leader arranges replacements; <strong>Class Replacements</strong> shows where each one stands.</p></div>`});
    /* ── Small-screen navigation drawer ─────────────────────────────────────
       Uses the app's OWN drawer markup and theme.css classes (`.nav-drawer`,
       `.nav-drawer-overlay`, `.nav-drawer-item.active`, `.nav-drawer-user`), so
       the side bar here matches the real one — including the signed-in user and
       Logout, which the old centred dialog had nowhere to put. */
    const navDrawer=$('navDrawer');
    const navOverlay=$('navDrawerOverlay');
    /* The drawer is only pushed off-screen, so by default Tab still walks into
       its hidden buttons — Logout included. Marking it `inert` while closed
       keeps the keyboard out until it is actually open. Preview-only fix. */
    navDrawer.inert = true;
    let navOrigin=null;
    function openNavDrawer() {
      const user=MockData.currentUser;
      $('navDrawerName').textContent=user.name;
      $('navDrawerId').textContent=user.staffId;
      $('navDrawerAvatar').textContent=user.name
        .replace(/^(En\.|Pn\.|Dr\.|Mr\.|Ms\.|Mrs\.)\s*/,'')
        .split(' ').filter(Boolean).map(part=>part[0]).slice(0,2).join('').toUpperCase();
      navOrigin=document.activeElement;
      navDrawer.inert = false;
      navDrawer.classList.add('open');
      navOverlay.classList.add('open');
      document.body.classList.add('preview-locked');
      $('navDrawerClose').focus({preventScroll:true});
    }
    function closeNavDrawer() {
      if(!navDrawer.classList.contains('open')) return;
      navDrawer.classList.remove('open');
      navOverlay.classList.remove('open');
      navDrawer.inert = true;
      document.body.classList.remove('preview-locked');
      navOrigin?.focus({preventScroll:true});
    }
    $('previewMenu').onclick=openNavDrawer;
    $('navDrawerClose').onclick=closeNavDrawer;
    $('navDrawerLogout').onclick=()=>notify('Preview only — logging out is disabled.');
    navOverlay.addEventListener('click',closeNavDrawer);
    document.addEventListener('click',e=>{const link=e.target.closest('[data-preview-link]');if(link){e.preventDefault();notify('Preview only — navigation to the live system is disabled.');}});
    document.addEventListener('click',e=>{
      const info=e.target.closest('[data-summary-info]');
      if(info) { e.preventDefault(); e.stopPropagation(); openSummaryExplanation(Number(info.dataset.summaryInfo)); return; }
      const next=e.target.closest('[data-next-week]');
      if(next) {
        state.week=Number(next.dataset.nextWeek);
        state.day=Number(next.dataset.nextDay);
        render();
        $('previewDayHeading').setAttribute('tabindex','-1');
        $('previewDayHeading').focus({preventScroll:true});
        $('previewDayHeading').scrollIntoView({block:'center',behavior:'instant'});
      }
      const card=e.target.closest('.summary-card');
      if(card) {
        const hover=window.matchMedia('(hover: hover) and (pointer: fine)').matches&&card.matches(':hover');
        const showing=card.classList.contains('preview-flipped')||(hover&&!card.classList.contains('preview-unflipped'));
        card.classList.toggle('preview-flipped',!showing);
        card.classList.toggle('preview-unflipped',showing);
      }
    });
    document.addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ')&&e.target.matches('.summary-card')) { e.preventDefault(); e.target.click(); }
    });
    document.addEventListener('mouseleave',e=>{
      if(e.target.matches?.('.summary-card')) e.target.classList.remove('preview-unflipped');
    },true);
    // Snapshot only the displayed week's mock facts. The hash works for file:// and
    // local HTTP without storage, postMessage, a server or a live-system endpoint.
    function printPreviewUrl() {
      const snapshot={
        version:1, week:state.week, day:state.day, weeks:MockData.semester.weeks,
        theme:document.documentElement.classList.contains('dark')?'dark':'light',
        semester:MockData.semester.label, lecturer:MockData.currentUser.name,
        staffId:MockData.currentUser.staffId,
        hours:Array.from({length:22},(_,i)=>`${String(8+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`),
        days:daysOf(state.week).map(d=>({label:d.abbr,date:d.date,off:d.sunday||d.holiday,holiday:d.holidayLabel})),
        events:eventsOf(state.week).map(e=>({day:e.di,start:e.start,span:e.end-e.start+1,
          code:`${e.code} (${e.type})`,lecturer:e.lecturer,venue:e.venue,status:statusOf(e),
          note:e.status==='cancelled'?'(Cancelled)':statusOf(e)==='conflict'?'(Conflict)':blockNote(e)}))
      };
      return `timetable-print-preview.html?page=student&from=student-timetable-prototype#snapshot=${encodeURIComponent(JSON.stringify(snapshot))}`;
    }
    $('previewPrint').onclick=()=>{window.location.href=printPreviewUrl();};
    $('previewBell').onclick=()=>notify('Preview only — the notification panel is not part of this mock.');
    /* ── data-tip tooltip, same contract as initDataTipTooltips() in ui-common.js ──
       One .data-tip-tooltip node (theme.css owns its look), above the element,
       `data-tip-pos="left"` for the top bar, `\n` tips switch to pre-line, and
       keyboard focus shows the same tip. Nothing is invented here. */
    function initDataTips() {
      const tip=document.createElement('div');
      tip.className='data-tip-tooltip';
      document.body.appendChild(tip);
      let focusedTipEl=null;
      const findTip=node=>node?.closest?.('[data-tip]')||null;
      const hide=()=>{ tip.style.opacity='0'; tip.style.visibility='hidden'; };
      function show(el) {
        const r=el.getBoundingClientRect(), text=el.getAttribute('data-tip')||'';
        if(!text) { hide(); return; }
        tip.textContent=text;
        tip.classList.toggle('data-tip-tooltip--multi',text.includes('\n'));
        tip.style.visibility='hidden'; tip.style.opacity='1';
        tip.style.left='0px'; tip.style.top='0px';
        const tw=tip.offsetWidth, th=tip.offsetHeight;
        let left, top;
        if(el.getAttribute('data-tip-pos')==='left') {
          left=Math.max(4,r.left-tw-8); top=Math.max(4,r.top+r.height/2-th/2);
        } else {
          left=Math.max(4,Math.min(r.left+r.width/2-tw/2,window.innerWidth-tw-4));
          top=r.top-th-6;
          if(top<4) top=r.bottom+6;
        }
        tip.style.left=`${left}px`; tip.style.top=`${top}px`;
        tip.style.opacity='1'; tip.style.visibility='visible';
      }
      document.addEventListener('mouseenter',e=>{const el=findTip(e.target);if(el)show(el);},true);
      document.addEventListener('mouseleave',e=>{if(focusedTipEl)return;if(findTip(e.target))hide();},true);
      document.addEventListener('mouseout',e=>{if(focusedTipEl)return;if(findTip(e.relatedTarget))return;if(findTip(e.target))hide();},true);
      document.addEventListener('focusin',e=>{focusedTipEl=findTip(e.target);if(focusedTipEl)show(focusedTipEl);},true);
      document.addEventListener('focusout',e=>{const el=findTip(e.target);if(!el)return;if(focusedTipEl===el)focusedTipEl=null;hide();},true);
    }
    $('previewUser').textContent=MockData.currentUser.name;
    initDataTips();
    window.addEventListener('resize',render);
    render();
  })();
  </script>
</body>
